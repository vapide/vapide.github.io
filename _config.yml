about:
  paragraphs:
    - >-
      I'm an undergraduate studying computer science and transferring to
      Michigan State. A lot of what I know came from trying to build things
      before I really knew how (ex., bitboard move generation, alpha-beta
      search, and quantized neural-network evaluation), then going back and
      rewriting them once I understood what I had done wrong.
    - >-
      Most of my time goes into chess engines because I like problems you can
      actually measure. If I change the search, I can run a few thousand games
      and find out whether it gained Elo or just looked good on paper. I keep
      a running experiment ledger for my main engine, and plenty of ideas I
      was convinced would work are in there as failures.
    - >-
      Outside of chess, I'm interested in compilers, obfuscation, and code
      transformation, or generally, anything involving software that has to
      understand or rewrite other software. I work mostly in Python and Java,
      with some C++ as I am learning it.

